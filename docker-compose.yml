# pi-docker — build the image locally and run it.
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose logs -f          # prints the resolved paths + the bind address
#
# Then open https://pi.example.com, pair your device once, and use the PWA.
# Prefer the published image? Use compose.ghcr.yaml instead.
#
# This one container is the whole stack: the headless **herdr** server, its
# **web UI** plugin (the app your phone installs as a PWA) and the **pi** coding
# agent the panes run. The two bind mounts are the whole persistence story —
# everything the agent or either app installs lives inside them (see the
# persistence model in the Dockerfile).

services:
  pi:
    build:
      context: .
      args:
        # Pin at build time for a reproducible image, e.g. 0.9.3 / v0.3.50.
        # "latest" resolves to the newest release; an explicit version fails the
        # build if what landed on disk is not that version.
        HERDR_VERSION: ${HERDR_VERSION:-latest}
        HERDR_WEB_UI_VERSION: ${HERDR_WEB_UI_VERSION:-v0.3.50}
        PI_CODING_AGENT_VERSION: ${PI_CODING_AGENT_VERSION:-latest}
        # Base image Node line: 26 (current LTS) by default, 24 also supported.
        NODE_VERSION: ${NODE_VERSION:-26}
    image: pi-docker:latest
    container_name: pi
    # `init: true` reaps the zombie processes the agent's shell/PTY children
    # would otherwise leave behind as PID 1.
    init: true
    restart: unless-stopped
    # Root on purpose: the agent installs system packages (apt) and writes into
    # host bind mounts, which a non-root uid cannot do. Drop this only if you
    # also chown the host directories to the uid you switch to.
    user: "0:0"
    # No `ports:` on purpose. Only the reverse proxy is meant to reach the web
    # UI, and it does so over the shared docker network. Publishing the port
    # would put the UI on every interface of the host: the plugin has no host
    # allow-list of its own (unlike the app this image used to ship), so an
    # unauthenticated first visit would be the thing that gets to pair it.
    #
    # If you really want direct access, publish it *and* set a HERDR_WEB_TOKEN
    # (see .env.example) so the port is not the only gate.
    environment:
      # Bind on all interfaces: a reverse proxy in a sibling container cannot
      # reach this container's 127.0.0.1. The plugin's own default is loopback.
      HERDR_WEB_HOST: ${HERDR_WEB_HOST:-0.0.0.0}
      # Keep in step with the loadbalancer label below.
      HERDR_WEB_PORT: ${HERDR_WEB_PORT:-7317}
      # Optional shared secret. Unset by default, which leaves the plugin's own
      # device pairing in charge; set it to require a secret as well. The vendor
      # recommends a token for any deployment behind a reverse proxy.
      # HERDR_WEB_TOKEN: ${HERDR_WEB_TOKEN:-}
      #
      # Everything else — HOME, PI_CODING_AGENT_DIR, NPM_CONFIG_PREFIX,
      # HERDR_INSTALL_DIR, HERDR_CONFIG_PATH, HERDR_WEB_STATE_DIR,
      # PI_WORKSPACE_DIR — is set by the image, see the Dockerfile.
    volumes:
      # HOME + agent config/sessions/keys + npm global prefix + herdr state and
      # config + the web UI plugin and its pairing data all live under here.
      # One volume, so a backup is a single tar.
      - ${USERDIR:-.}/data/pi/data:/data
      # The agent's project files (PI_WORKSPACE_DIR) — the panes open here.
      - ${USERDIR:-.}/data/pi/workspace:/workspace
    labels:
      - traefik.enable=true
      - traefik.http.routers.pi.rule=Host(`pi.notato.xyz`)
      - traefik.http.routers.pi.middlewares=authentik@file
      - traefik.http.services.pi.loadbalancer.server.port=7317
    networks:
      - traefik

networks:
  traefik:
    external: true
