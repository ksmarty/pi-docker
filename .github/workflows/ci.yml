name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR branch, etc.).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build + smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Both supported Node lines are exercised, because node-pty has no linux
    # prebuild and must compile from source against whatever Node the base image
    # ships — a version bump is exactly the change that breaks it silently.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # No push: this proves the Dockerfile still builds from a clean checkout.
      # The multi-arch publish lives in release.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pi-docker:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            NODE_VERSION=${{ matrix.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is already loaded, so this checks that the baked-in app really
      # is on PATH and starts — the failure mode a plain build hides. It runs
      # through the real entrypoint and a login shell, so it also covers the
      # entrypoint's mkdir/profile.d work and the PATH ordering that keeps a
      # stale /data/npm copy from shadowing the image's pi-web-ui.
      #
      # The test itself lives in scripts/ci-smoke.sh, which is piped in rather
      # than inlined: an inline script has to survive `bash -lc '<script>'`, and
      # one single quote inside it silently truncates it into extra docker args.
      - name: Smoke-test the image
        run: |
          docker run --rm -e EXPECT_NODE='${{ matrix.node }}' pi-docker:ci \
            bash -lc "$(cat scripts/ci-smoke.sh)"

      # Regression test for the v0.1.0 outage: pi-web-ui refuses any Host it is
      # not told about, so the old healthcheck (plain fetch to 127.0.0.1)
      # returned 403 forever and the container never looked healthy while the app
      # was serving fine. Boots the image in that configuration and requires it
      # to reach `healthy` on its own, annotating the probe output on failure.
      - name: Healthcheck passes under a strict host allow-list
        run: bash scripts/ci-health.sh

      # The Host guard is the whole point of the allow-list, so pin the contract
      # the healthcheck depends on: the allowed host answers, anything else is
      # refused with 403.
      - name: Host guard answers the allowed host and refuses others
        run: bash scripts/ci-host-guard.sh

      # The entrypoint has to clean up after the pre-Dockerfile layout, where
      # pi-web-ui and the pi CLI lived in the persisted npm prefix. Left there,
      # a stale copy can disagree with the SDK the image was built against, so
      # the removal is a feature and gets a test — including the guard that stops
      # it from deleting the only install when there is no image copy to use.
      - name: Entrypoint removes migrated installs from /data/npm
        run: |
          docker run --rm pi-docker:ci \
            bash -lc "$(cat scripts/ci-migrated-install.sh)"

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose files
        env:
          USERDIR: /tmp/pi-docker
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f compose.ghcr.yaml config >/dev/null

      # The entrypoint and the CI test scripts are the parts of this repo a
      # syntax error hides in until the worst moment.
      - name: Shell scripts parse cleanly
        run: bash -n docker-entrypoint.sh scripts/*.sh
