name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR branch, etc.).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build + smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Two Node lines are built and smoke-tested. Nothing in this image compiles a
    # native module at build time any more (herdr ships a prebuilt static binary,
    # and the plugin's dependencies are installed from the lockfile), so this is
    # no longer a compiler check — it is the cheap proof that the agent CLI, the
    # plugin's registration, the skill loader and the entrypoint still work end to
    # end on both supported lines.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # No push: this proves the Dockerfile still builds from a clean checkout.
      # The multi-arch publish lives in release.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pi-docker:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            NODE_VERSION=${{ matrix.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is already loaded, so this checks that the baked-in tools really
      # are on PATH and start, that the apps were seeded into the volume, and that
      # a fresh volume is complete without any network access — the failure modes
      # a plain build hides. It runs through the real entrypoint and a login
      # shell, so it also covers the entrypoint's mkdir/profile.d/skill work and
      # the PATH ordering that keeps a stale /data/npm copy from shadowing the
      # image's pi CLI.
      #
      # The test itself lives in scripts/ci-smoke.sh, which is piped in rather
      # than inlined: an inline script has to survive `bash -lc '<script>'`, and
      # one single quote inside it silently truncates it into extra docker args.
      - name: Smoke-test the image
        run: |
          docker run --rm -e EXPECT_NODE='${{ matrix.node }}' pi-docker:ci \
            bash -lc "$(cat scripts/ci-smoke.sh)"

      # Regression test for the outage that started this repo: the container was
      # serving, but its healthcheck probed with a Host header the app refused, so
      # docker reported `unhealthy` forever and `docker compose up --wait` gave up
      # — "it never came online". Boots the image fresh (empty volume, no
      # environment beyond the compose defaults), requires it to reach `healthy` on
      # its own, and checks from inside that herdr's server, the seeded plugin and
      # the plugin process are really there.
      - name: Healthcheck reaches healthy on its own, from an empty volume
        run: bash scripts/ci-health.sh

      # The served HTTP contract of the web UI, pinned from outside: the shell is
      # served, /api/health reports ok:true with the herdr link and the web_ui boot
      # state, a foreign Host changes nothing (this plugin has no host allow-list —
      # asserting otherwise is how the previous probe lied), and /health without
      # /api is the SPA rather than an endpoint. Runs with a token set, so the
      # locked-down configuration is what gets tested.
      - name: Web UI serves its shell and an ok:true health body
        run: bash scripts/ci-web-ui.sh

      # The invariant the whole image exists for: a tool the agent installs into
      # /data/npm, the agent's own state and a plugin update all survive a restart
      # *and* a container recreate — and re-seeding must never overwrite a volume
      # that already has the apps, or `herdr update` would silently revert.
      - name: Tools, agent state and app updates survive restart and recreate
        run: bash scripts/ci-persistence.sh

      # The entrypoint has to clean up after the pre-Dockerfile layout, where the
      # old web UI and the pi CLI lived in the persisted npm prefix. Left there,
      # a stale copy can disagree with the SDK the image was built against, so the
      # removal is a feature and gets a test — including the guard that stops it
      # from deleting the only install when there is no image copy to fall back on.
      - name: Entrypoint removes migrated installs from /data/npm and never reseeds
        run: |
          docker run --rm pi-docker:ci \
            bash -lc "$(cat scripts/ci-migrated-install.sh)"

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose files
        env:
          USERDIR: /tmp/pi-docker
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f compose.ghcr.yaml config >/dev/null

      # The entrypoint and the CI test scripts are the parts of this repo a
      # syntax error hides in until the worst moment.
      - name: Shell scripts parse cleanly
        run: bash -n docker-entrypoint.sh scripts/*.sh
