name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR branch, etc.).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build + smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Two Node lines are built and smoke-tested. Nothing in this image compiles a
    # native module at build time any more (Collie and herdr ship prebuilt
    # binaries for each architecture), so this is no longer a compiler check — it
    # is the cheap proof that the agent CLI, the skill loader and the entrypoint
    # still work end to end on both supported lines.
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # No push: this proves the Dockerfile still builds from a clean checkout.
      # The multi-arch publish lives in release.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pi-docker:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            NODE_VERSION=${{ matrix.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is already loaded, so this checks that the baked-in tools really
      # are on PATH and start, that the apps were seeded into the volume, and that
      # a fresh volume is complete without any network access — the failure modes
      # a plain build hides. It runs through the real entrypoint and a login
      # shell, so it also covers the entrypoint's mkdir/profile.d/skill work and
      # the PATH ordering that keeps a stale /data/npm copy from shadowing the
      # image's pi CLI.
      #
      # The test itself lives in scripts/ci-smoke.sh, which is piped in rather
      # than inlined: an inline script has to survive `bash -lc '<script>'`, and
      # one single quote inside it silently truncates it into extra docker args.
      - name: Smoke-test the image
        run: |
          docker run --rm -e EXPECT_NODE='${{ matrix.node }}' pi-docker:ci \
            bash -lc "$(cat scripts/ci-smoke.sh)"

      # Regression test for the v0.1.0 outage: Collie refuses any Host it is not
      # told about, so a plain probe to 127.0.0.1 fails and the container never
      # looked healthy while the app was serving fine. Boots the image in that
      # configuration, requires it to reach `healthy` on its own, and checks from
      # inside that the seeded apps and herdr's server are really there.
      - name: Healthcheck passes under a strict host allow-list
        run: bash scripts/ci-health.sh

      # The host allow-list is the whole point of COLLIE_PUBLIC_HOSTS, so pin the
      # contract the healthcheck depends on: the allowed host is served, an
      # unknown Host is not.
      - name: Host guard answers the allowed host and refuses others
        run: bash scripts/ci-host-guard.sh

      # The entrypoint has to clean up after the pre-Dockerfile layout, where the
      # old web UI and the pi CLI lived in the persisted npm prefix. Left there,
      # a stale copy can disagree with the SDK the image was built against, so the
      # removal is a feature and gets a test — including the guard that stops it
      # from deleting the only install when there is no image copy to fall back on.
      - name: Entrypoint removes migrated installs from /data/npm and never reseeds
        run: |
          docker run --rm pi-docker:ci \
            bash -lc "$(cat scripts/ci-migrated-install.sh)"

  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose files
        env:
          USERDIR: /tmp/pi-docker
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f compose.ghcr.yaml config >/dev/null

      # The entrypoint and the CI test scripts are the parts of this repo a
      # syntax error hides in until the worst moment.
      - name: Shell scripts parse cleanly
        run: bash -n docker-entrypoint.sh scripts/*.sh
